<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Objects & Classes in JS</title>
  </head>
  <body>
    <h2>Coder's Bank</h2>
    <form id="accountForm" action="">
      <input type="text" placeholder="Customer Name" id="customerName" />
      <input type="number" placeholder="Initial Balance" id="balance" />
      <button>Create Account</button>
    </form>
    <hr />
    <h2>Deposit Form</h2>
    <form id="depositForm" action="">
      <input type="number" placeholder="Account Number" id="accountNumber" />
      <input type="number" placeholder="Amount" id="amount" />
      <button>Deposit</button>
    </form>

    <script src="app.js"></script>
    <script src="user.js"></script>
    <script src="constructorFunction.js"></script>
    <script src="prototype.js"></script>
    <script src="5_encapsulation.js"></script>
  </body>
</html>
